# Parameters for usb_cam node — DWE exploreHD 3.0
# Ref: https://docs.dwe.ai/exploreHD/specs/exploreHD
/**:
  ros__parameters:
    video_device: "/dev/explorehd_cam"
    framerate: 30.0
    image_width: 640
    image_height: 480
    pixel_format: "yuyv2rgb"
    camera_name: "hd_camera"
    # Must match extrinsics.camera.child_frame in pinchy.yaml (the robot description frame).
    frame_id: "hd_camera_link"
    io_method: "mmap"
    camera_info_url: ""
    brightness: -1
    contrast: -1
    saturation: -1
    sharpness: -1
    autofocus: false
    autowhitebalance: true
