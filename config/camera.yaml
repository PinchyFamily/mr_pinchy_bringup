# usb_cam parameters for the auxiliary DWE exploreHD 3.0 camera.
# Ref: https://docs.dwe.ai/exploreHD/specs/exploreHD
# /dev/explorehd_cam comes from the udev rule in mr_pinchy/setup/udev.
# frame_id is set by camera.launch.py from extrinsics.camera.child_frame in pinchy.yaml.
/**:
  ros__parameters:
    video_device: "/dev/explorehd_cam"
    framerate: 30.0
    image_width: 1920
    image_height: 1080
    pixel_format: "mjpeg2rgb"
    camera_name: "explorehd"
    io_method: "mmap"
    camera_info_url: ""
    # Auto-exposure on by default; set to 1 (manual) to use exposure_auto below
    # auto_exposure: true
    # exposure: 90
    brightness: -1
    contrast: -1
    saturation: -1
    sharpness: -1
    autofocus: false
    autowhitebalance: true
