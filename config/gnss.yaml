ublox_dgnss:
  ros__parameters:
    DEVICE_FAMILY: "X20P"
    DEVICE_SERIAL_STRING: ""
    FRAME_ID: "gnss"
    CFG_USBOUTPROT_NMEA: false
    CFG_USBINPROT_RTCM3X: true
    CFG_NAVHPG_DGNSSMODE: 3
    CFG_RATE_MEAS: 40
    CFG_RATE_NAV: 1
    # USB output messages
    CFG_MSGOUT_UBX_NAV_HPPOSLLH_USB: 1
    CFG_MSGOUT_UBX_NAV_STATUS_USB: 5
    CFG_MSGOUT_UBX_NAV_COV_USB: 1
    CFG_MSGOUT_UBX_RXM_COR_USB: 1
    CFG_MSGOUT_UBX_RXM_RTCM_USB: 1

# NTRIP client settings that are not secret. Caster, mountpoint and
# credentials come from the ntrip section of config/secrets.yaml.
ntrip_client:
  ros__parameters:
    reflat: 59.204371
    reflon: 18.175105
    refalt: 20.6
    ggainterval: 10
    use_live_gga: true
    fix_topic: "/fix"
